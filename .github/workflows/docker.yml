name: Build and publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

# Отменять очереди старых сборок: каждый пуш собирает только актуальное
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          # latest + sha коммита: видно, какой именно код в образе
          tags: |
            ghcr.io/kerber0ss/mi-dashboard:latest
            ghcr.io/kerber0ss/mi-dashboard:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Образ опубликован" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/kerber0ss/mi-dashboard:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/kerber0ss/mi-dashboard:sha-${{ steps.meta.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Дigest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"